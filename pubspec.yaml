name: valorave
description: "ValoraVE — cuánto vale tu dinero en Venezuela. Tasas BCV/paralelo, conversor, lista en vivo, libro de precios y salas con su propia tecnología. Offline-first."
publish_to: 'none'

# 1.13.0-beta+33 · v20.4 — auditoría de paquetes: fotos de ticket a ARCHIVO
# (fuera del JSON de estado), IsolatedHive para 2º plano (hive_ce: sin
# corrupción de cajas), uuid v4 para IDs P2P, csv RFC 4180, talker para
# observabilidad 100 % local y syncfusion_flutter_charts RETIRADO (los 3
# gráficos ahora son CustomPainter propio, APKs más livianos).
version: 1.13.0-beta+33

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Estado / navegación ──────────────────────────────────────────────────
  provider: ^6.1.5                  # estado + DI (decisión cerrada del dueño)
  nested: ^1.0.0                    # (transitivo de provider) tipado de listas de providers
  go_router: ^16.3.0                # shell 8 rutas + ramas stateful (GUI dp4)
  flutter_web_plugins:              # deep link web (v20.3): usePathUrlStrategy —
    sdk: flutter                    # ya venía transitivo por go_router, mismo lock

  # ── Persistencia offline-first ───────────────────────────────────────────
  hive_ce: ^2.20.0                  # libro, snapshots, outbox (Community Edition, v19)
  hive_ce_flutter: ^2.3.4           # initFlutter (path_provider integrado)
  path_provider: ^2.1.5             # rutas de datos (+ override abajo)
  shared_preferences: ^2.3.2        # prefs UI (ticker, tema, tips)
  uuid: ^4.6.0                      # IDs únicos P2P (v4): newId() sin colisión
                                    # cuando dos teléfonos editan la Sala Viva
                                    # sin internet (antes era transitiva)

  # ── Red ──────────────────────────────────────────────────────────────────
  dio: ^5.7.0                       # tablero de tasas + SSE propio (§trap 1)
  connectivity_plus: ^7.3.1         # offline REAL (v17.8): saber cuándo NO hay red
  socket_io_client: 2.0.3+1         # sala modo Servidor (relay del usuario · orden del dueño v19)

  # ── Plataforma Android ───────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4   # 5 canales locales (sin FCM)
  file_picker: ^12.2.0              # import CSV/JSON (§trap 2: NO 11.x)
  home_widget: ^0.9.4               # widgets BCV/panel
  workmanager: ^0.10.10             # refresco horario + respaldo semanal
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0             # nivel SDK Android: pedir solo los permisos Nearby que aplican (13.x para coexistir con package_info_plus 10: win32)
  local_auth: ^2.3.0                # bloqueo biométrico
  package_info_plus: ^10.0.2        # APP_VERSION en Ajustes
  share_plus: ^13.0.0               # compartir PNG/PDF/CSV
  flutter_image_compress: ^2.1.0    # re-encode JPEG de tickets viejos (v17.2)
  image_picker: ^1.1.2              # foto de ticket (1024px JPEG .72 nativo)
  mobile_scanner: ^5.2.3            # escáner continuo con zoom
  quick_actions: ^1.1.1             # 4 shortcuts del launcher (manifest PWA)
  nearby_connections: ^4.1.0        # sala P2P sin internet (WiFi-Direct/BT/BLE)

  # ── UI / visualización / documentos ────────────────────────────────────────
  shadcn_ui: ^0.57.1                # GUI nueva «Linear/Vercel» (orden del dueño TASK-33): componentes shadcn/ui con tokens VeColors exactos
  lucide_icons_flutter: ^3.1.20     # iconografía Lucide del rediseño (trazo fino, look Linear)
  # syncfusion_flutter_charts RETIRADO (v20.4): los 3 gráficos (brecha,
  # canasta, producto) viven en CustomPainter propio (ve/charts.dart) —
  # APKs/AAB sensiblemente más livianos y cero condiciones de licencia.
  csv: ^6.0.0                       # export RFC 4180 estricto (toCSV): comillas
                                    # y saltos de línea de notas NO rompen columnas.
                                    # (6.x: la última que acepta Dart 3.9 del CI;
                                    # 7/8 exigen Dart 3.10.1)
  talker_flutter: ^5.1.20           # observabilidad 100 % LOCAL: buffer en el
                                    # teléfono, visor en Ajustes → Diagnóstico.
                                    # Nada sale del dispositivo (privacidad).
  dynamic_color: ^1.7.0             # Material You opcional
  qr_flutter: ^4.1.0                # QR de sala
  pdf: ^3.11.1                      # constancias PDF
  printing: ^5.13.2
  intl: ^0.20.3                     # formato es-VE (0.20.3: lo exige flutter_localizations)
  flutter_localizations:            # delegates es-VE (fix: showDatePicker
    sdk: flutter                    # renderizaba en inglés — es-VE real)
  decimal: ^3.0.2                   # dinero exacto (decimal.js del web → Decimal Dart)

dev_dependencies:
  connectivity_plus_platform_interface: ^2.1.0  # seam de tests (v17.8): fake de plataforma
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/flags/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500

dependency_overrides:
  # §trap 3: path_provider_android 2.3.x arrastra jni/NDK C++ (2.4 GB);
  # 2.2.17 es Kotlin puro sin NDK.
  path_provider_android: 2.2.17
