name: valorave
description: "ValoraVE — cuánto vale tu dinero en Venezuela. Tasas BCV/paralelo, conversor, lista en vivo, libro de precios y salas con su propia tecnología. Offline-first."
publish_to: 'none'

# 1.8.0-beta+17 · ronda v18.0 — conversor XE/Wise, Bluetooth RFCOMM real,
# Sala Viva propia, generadores off-stage y APK con nombre semántico.
# (Regla 5 de AGENT.md · 1.x.y-beta+z · Regla 9: cobertura total de ABI).
version: 1.8.0-beta+17

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Estado / navegación ──────────────────────────────────────────────────
  provider: ^6.1.5                  # estado + DI (decisión cerrada del dueño)
  nested: ^1.0.0                    # (transitivo de provider) tipado de listas de providers
  go_router: ^16.3.0                # shell 8 rutas + ramas stateful (GUI dp4)

  # ── Persistencia offline-first ───────────────────────────────────────────
  hive_ce: ^2.20.0                  # libro, snapshots, outbox (Community Edition, v19)
  hive_ce_flutter: ^2.3.4           # initFlutter (path_provider integrado)
  path_provider: ^2.1.5             # rutas de datos (+ override abajo)
  shared_preferences: ^2.3.2        # prefs UI (ticker, tema, tips)

  # ── Red ──────────────────────────────────────────────────────────────────
  dio: ^5.7.0                       # tablero de tasas + SSE propio (§trap 1)
  connectivity_plus: ^7.3.1         # offline REAL (v17.8): saber cuándo NO hay red
  socket_io_client: 2.0.3+1         # sala lista-sync (transporte Servidor)

  # ── Plataforma Android ───────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4   # 5 canales locales (sin FCM)
  file_picker: ^12.2.0              # import CSV/JSON (§trap 2: NO 11.x)
  home_widget: ^0.9.4               # widgets BCV/panel
  workmanager: ^0.10.10             # refresco horario + respaldo semanal
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0             # nivel SDK Android: pedir solo los permisos Nearby que aplican (13.x para coexistir con package_info_plus 10: win32)
  local_auth: ^2.3.0                # bloqueo biométrico
  package_info_plus: ^10.0.2        # APP_VERSION en Ajustes
  share_plus: ^13.0.0               # compartir PNG/PDF/CSV
  flutter_image_compress: ^2.1.0    # re-encode JPEG de tickets viejos (v17.2)
  image_picker: ^1.1.2              # foto de ticket (1024px JPEG .72 nativo)
  mobile_scanner: ^5.2.3            # escáner continuo con zoom
  quick_actions: ^1.1.1             # 4 shortcuts del launcher (manifest PWA)
  nearby_connections: ^4.1.0        # sala P2P sin internet (WiFi-Direct/BT/BLE)

  # ── UI / visualización / documentos ──────────────────────────────────────
  syncfusion_flutter_charts: ^27.1.48    # brecha, evolución, histórico
  dynamic_color: ^1.7.0             # Material You opcional
  qr_flutter: ^4.1.0                # QR de sala
  pdf: ^3.11.1                      # constancias PDF
  printing: ^5.13.2
  intl: ^0.19.0                     # formato es-VE
  decimal: ^3.0.2                   # dinero exacto (decimal.js del web → Decimal Dart)

dev_dependencies:
  connectivity_plus_platform_interface: ^2.1.0  # seam de tests (v17.8): fake de plataforma
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/flags/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

dependency_overrides:
  # §trap 3: path_provider_android 2.3.x arrastra jni/NDK C++ (2.4 GB);
  # 2.2.17 es Kotlin puro sin NDK.
  path_provider_android: 2.2.17
