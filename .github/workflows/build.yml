# Build release: gates → keystore de secrets → APK split-per-abi + AAB
# ofuscados → artifacts (retención 30) → Release en tags v*.
name: Build

on:
  push:
    branches: [main, 'fix/v1.1.0-dp4-paridad']
    tags: ['v*']

# Privilegio mínimo: solo escritura de contenidos (crear Release y subir
# assets). Sin esto, github.token por defecto es read-only y el paso de
# Release falla con 403 «Resource not accessible by integration».
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caché de Gradle (v17.6): el runner hosted nos mató 3 builds con
      # SIGTERM ~16-19 min dentro. Con caché caliente assembleRelease baja
      # de ~12-14 min a ~4-6 — el job cabe holgado en la ventana.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: pub get
        run: flutter pub get

      # Guardia rápida: analyze. La suite completa corre en el workflow CI
      # sobre el MISMO SHA (duplicarla aquí alarga el job ~13 min y el
      # runner hosted nos canceló 2 builds con SIGTERM a mitad de Gradle).
      - name: flutter analyze (0 issues)
        run: flutter analyze

      - name: Decodificar keystore desde secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/valorave-release.keystore
          {
            echo "storeFile=valorave-release.keystore"
            echo "storePassword=$KS_STORE_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PASS"
          } > android/keystore.properties

      - name: flutter build apk (release, split-per-abi, ofuscado)
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols/apk

      # Upload INMEDIATO de los APK (v17.6): el runner hosted nos mató 4
      # builds con SIGTERM ~17-19 min dentro. Si muere más adelante, los
      # APK del dueño ya están a salvo en el artifact.
      - name: Upload APK (protección anti-SIGTERM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valorave-apk
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/symbols/apk/

      # AAB SOLO en tags (v17.6): el AAB es para Play Store (release por
      # tag); en builds de rama solo alarga el job ~5 min en la ventana
      # donde el runner muere. El dueño prueba APK.
      - name: flutter build appbundle (release, ofuscado)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/aab

      - name: Upload artifacts completos (AAB + símbolos, tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: valorave-aab
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/aab/

      - name: GitHub Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN || github.token }}
