# Build release: APK firmados por ABI en MATRIZ paralela (anti-SIGTERM v17.6)
# + AAB (v19.2) → PAQUETE ÚNICO: un solo ZIP con los 4 APK + el AAB.
#
# POR QUÉ MATRIZ: el runner hosted mató 6 jobs con SIGTERM a los ~16-19 min
# (reloj consistente). Un job único con Gradle frío (setup 4.5 + Gradle
# 12-14 + upload) siempre caía en la ventana. Con matrix, cada ABI compila
# en SU propio job (~11-13 min): cada uno entra holgado. La caché de Gradle
# comparte fingerprints entre jobs del mismo SHA.
#
# v17.9 — CUALQUIER dispositivo (orden del dueño, AGENT.md Regla 9): la
# matriz produce SIEMPRE armeabi-v7a (androids viejos), arm64-v8a
# (nuevos), x86_64 (emuladores e Intel) y universal (todo-en-uno ~45 MB).
# Nota técnica: Flutter no distribuye motor para x86 de 32 bits — ese ABI
# no existe; un emulador 32-bit no puede correr la app.
#
# v18.0 — NOMBRES CON SEMÁNTICA (orden del dueño): cada binario sale como
# valorave-v{versión}-build-{AAAAMMDD Caracas}-{abi}.apk/.aab.
#
# v19.2 — UN ZIP CON TODO (orden del dueño): el job `paquete` junta los
# 4 APK + el AAB + un LEEME.txt y entrega UN solo artefacto
# valorave-v{versión}-build-{fecha}-completo.zip. El AAB pasa de
# solo-tags a CADA ronda. Los artefactos intermedios de la matriz viven
# 1 día (solo sirven para que `paquete` los junte); el ZIP y los símbolos
# de ofuscación viven 30. Compiladores estándar: ubuntu-latest + temurin
# 17 + Flutter estable fijado (3.47.4).
name: Build

on:
  push:
    branches: [main, 'fix/v1.1.0-dp4-paridad']
    tags: ['v*']

# Privilegio mínimo: solo escritura de contenidos (crear Release y subir
# assets). Sin esto, github.token por defecto es read-only y el paso de
# Release falla con 403 «Resource not accessible by integration».
permissions:
  contents: write

jobs:
  apk:
    # Un job POR ABI + universal. El dueño instala en cualquier cosa:
    # android viejo, nuevo o emulador (orden v17.9).
    strategy:
      fail-fast: false
      matrix:
        include:
          # Teléfonos nuevos (ARM 64-bit).
          - abi: arm64-v8a
            platform: android-arm64
          # Androids viejos (ARM 32-bit, API 21+).
          - abi: armeabi-v7a
            platform: android-arm
          # Emuladores e Intel 64-bit.
          - abi: x86_64
            platform: android-x64
          # TODO-EN-UNO: los 3 ABI embebidos. El APK que instala en
          # cualquier dispositivo sin saber su arquitectura.
          - abi: universal
            platform: none
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caché de Gradle compartida por SHA de android/.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: pub get
        run: flutter pub get
      # SIN analyze ni test aquí: el workflow CI los corre sobre el MISMO
      # SHA y ya está VERDE (cada minuto cuenta con el reaper del runner).

      - name: Decodificar keystore desde secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/valorave-release.keystore
          {
            echo "storeFile=valorave-release.keystore"
            echo "storePassword=$KS_STORE_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PASS"
          } > android/keystore.properties

      - name: flutter build apk ${{ matrix.abi }} ofuscado
        run: |
          if [ "${{ matrix.abi }}" = "universal" ]; then
            # Sin --split-per-abi: un solo APK con los 3 ABI embebidos
            # (más lento: 3 compilaciones AOT — es el job más largo de la
            # matriz; si el reaper lo mata, rerun-failed-jobs lo rescata).
            flutter build apk --release \
              --obfuscate --split-debug-info=build/symbols/apk
          else
            flutter build apk --release --split-per-abi \
              --target-platform ${{ matrix.platform }} \
              --obfuscate --split-debug-info=build/symbols/apk
          fi

      # v18.0: nombre con semántica — valorave-v{versión}-build-{fecha}-{abi}.apk
      # (fecha en America/Caracas, la del dueño).
      - name: Renombrar APK (versión + build + fecha)
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          DATE=$(TZ=America/Caracas date +%Y%m%d)
          if [ "${{ matrix.abi }}" = "universal" ]; then
            SRC="build/app/outputs/flutter-apk/app-release.apk"
          else
            SRC="build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          fi
          DST="build/app/outputs/flutter-apk/valorave-v${VERSION}-build-${DATE}-${{ matrix.abi }}.apk"
          mv "$SRC" "$DST"
          echo "Renombrado -> $(basename "$DST")"

      # Upload INMEDIATO: si el reaper llega, lo que ya subió queda a salvo.
      # INTERMEDIO (v19.2): solo vive 1 día — su único consumidor es el job
      # `paquete` de este mismo run; el artefacto final es el ZIP.
      - name: Upload APK ${{ matrix.abi }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valorave-apk-${{ matrix.abi }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            build/app/outputs/flutter-apk/valorave-v*.apk
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols/apk/

  # AAB (Google Play) — v19.2: en CADA ronda de build (antes solo en
  # tags). El dueño pidió el paquete completo siempre: 4 APK + AAB.
  aab:
    name: AAB (Play Store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Decodificar keystore desde secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/valorave-release.keystore
          {
            echo "storeFile=valorave-release.keystore"
            echo "storePassword=$KS_STORE_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PASS"
          } > android/keystore.properties

      - name: flutter build appbundle release ofuscado
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/aab

      # v18.0: el AAB también lleva su nombre semántico.
      - name: Renombrar AAB (versión + build + fecha)
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          DATE=$(TZ=America/Caracas date +%Y%m%d)
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/valorave-v${VERSION}-build-${DATE}.aab"
          ls -la build/app/outputs/bundle/release/

      - name: Upload AAB (intermedio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valorave-aab
          retention-days: 1
          if-no-files-found: ignore
          path: |
            build/app/outputs/bundle/release/valorave-v*.aab
            build/symbols/aab/

  # PAQUETE ÚNICO (v19.2, orden del dueño): junta los 4 APK + el AAB,
  # escribe un LEEME y entrega UN solo artefacto ZIP. Sin Flutter ni
  # Gradle: solo descargar, ordenar y comprimir (~2 min).
  paquete:
    name: ZIP todo-en-uno
    needs: [apk, aab]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar binarios de la matriz
        uses: actions/download-artifact@v4
        with:
          pattern: 'valorave-apk-*'
          merge-multiple: true
          path: dist

      - name: Descargar AAB
        uses: actions/download-artifact@v4
        with:
          name: valorave-aab
          path: dist

      - name: Armar paquete (LEEME + ZIP + símbolos)
        run: |
          set -euo pipefail
          # Sin checkout: la versión viaja en los nombres de los binarios.
          APK=$(find dist -name 'valorave-v*-arm64-v8a.apk' | head -1)
          test -n "$APK" || { echo "ERROR: falta el APK arm64"; exit 1; }
          VERSION=$(basename "$APK" | sed -E 's/valorave-v([^-]+)-build-.*/\1/')
          DATE=$(TZ=America/Caracas date +%Y%m%d)

          mkdir -p paquete simbolos
          find dist -name 'valorave-v*.apk' -exec cp {} paquete/ \;
          find dist -name 'valorave-v*.aab' -exec cp {} paquete/ \;
          find dist -name '*.symbols' -exec cp {} simbolos/ \;

          echo "Binarios del paquete:"
          ls -la paquete/
          # Exigir los 5: si un rerun parcial dejara un hueco, falla AQUÍ
          # y no en manos del dueño.
          for f in arm64-v8a armeabi-v7a x86_64 universal; do
            ls paquete/valorave-v*-build-*-"$f".apk > /dev/null
          done
          ls paquete/valorave-v*-build-*.aab > /dev/null

          cat > paquete/LEEME.txt <<'LEEME'
          VALORAVE — paquete completo de instalación
          ===========================================

          CONTENIDO (elige el que necesitas):
          - *-arm64-v8a.apk    → Teléfonos Android MODERNOS (64-bit). El
                                 más común: si no sabes cuál, prueba este.
          - *-armeabi-v7a.apk  → Teléfonos Android VIEJOS (32-bit).
          - *-x86_64.apk       → EMULADORES de PC y dispositivos Intel.
          - *-universal.apk    → TODO-EN-UNO: instala en cualquier
                                 dispositivo (pesa más).
          - *.aab              → SOLO para subir a Google Play. No se
                                 instala directo en el teléfono.

          CÓMO INSTALAR UN APK:
          1. Copia el APK al teléfono y ábrelo desde el administrador
             de archivos.
          2. Si pide permiso de «instalar apps desconocidas», otórgalo
             al administrador de archivos.
          3. Instala y abre. Todos vienen firmados con la misma clave.

          INTEGRIDAD: checksums.sha256 verifica que ningún archivo se
          corrompió al descargar (opcional):
          sha256sum -c checksums.sha256

          LICENCIA: software PROPIETARIO — todos los derechos reservados.
          Uso personal del titular y de quienes él autorice por escrito.
          Ver LICENSE en el repositorio.
          LEEME

          (cd paquete && sha256sum *.apk *.aab > checksums.sha256)

          ZIP="valorave-v${VERSION}-build-${DATE}-completo.zip"
          (cd paquete && zip -X "../${ZIP}" LEEME.txt checksums.sha256 *.apk *.aab)

          echo "== contenido del ZIP =="
          unzip -l "${ZIP}"

      - name: Upload ZIP completo
        uses: actions/upload-artifact@v4
        with:
          name: valorave-completo
          retention-days: 30
          if-no-files-found: error
          path: valorave-v*-completo.zip

      # Símbolos de ofuscación (para des-ofuscar stacktraces): aparte del
      # ZIP — no son instalables.
      - name: Upload símbolos de ofuscación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valorave-simbolos
          retention-days: 30
          if-no-files-found: ignore
          path: simbolos/

  # Release (SOLO tags): ya no compila nada — descarga el ZIP del job
  # `paquete` de este MISMO run y adjunta los 6 archivos (4 APK + AAB +
  # el ZIP todo-en-uno). v17.9: exigir TODOS (fail_on_unmatched_files)
  # para que una Release jamás salga mutilada en silencio.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paquete
    runs-on: ubuntu-latest
    steps:
      - name: Descargar paquete completo
        uses: actions/download-artifact@v4
        with:
          name: valorave-completo
          path: dist

      - name: Descomprimir y verificar
        run: |
          set -euo pipefail
          unzip -o dist/valorave-v*-completo.zip -d release-assets/
          echo "== assets de la release =="
          ls -la release-assets/
          test -n "$(find release-assets -name '*-arm64-v8a.apk')"
          test -n "$(find release-assets -name '*-armeabi-v7a.apk')"
          test -n "$(find release-assets -name '*-x86_64.apk')"
          test -n "$(find release-assets -name '*-universal.apk')"
          test -n "$(find release-assets -name '*.aab')"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/valorave-v*-arm64-v8a.apk
            release-assets/valorave-v*-armeabi-v7a.apk
            release-assets/valorave-v*-x86_64.apk
            release-assets/valorave-v*-universal.apk
            release-assets/valorave-v*.aab
            dist/valorave-v*-completo.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN || github.token }}
