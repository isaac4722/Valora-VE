# CI · gates en cada push/PR: pub get → analyze (0) → test (suite verde).
# Flutter SIEMPRE última stable (decisión §4.16; el gate protege de roturas).
name: CI

on:
  push:
    branches: [main, 'fix/v1.1.0-dp4-paridad']
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: pub get
        run: flutter pub get

      - name: flutter analyze (0 issues)
        run: flutter analyze

      - name: flutter test (unit + widget)
        run: flutter test
