# CI · gates en cada push/PR: pub get → quality_gate.sh (analyze 0 + suite
# verde + auditoría UI). El gate vive en scripts/quality_gate.sh (AGENT.md).
# Flutter SIEMPRE última stable (decisión §4.16; el gate protege de roturas).
name: CI

on:
  push:
    branches: [main, 'fix/v1.1.0-dp4-paridad']
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4

      - name: pub get
        run: flutter pub get

      - name: Gate de Calidad (analyze + test + auditoría UI)
        run: bash scripts/quality_gate.sh
