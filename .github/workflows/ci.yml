# CI · gates en cada push/PR: pub get → analyze (0) → test (suite verde).
# Flutter SIEMPRE última stable (decisión §4.16; el gate protege de roturas).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijado a 3.47.5 (entorno documentado TASK-16, pubspec sdk ^3.9.2):
          # 3.50 deprecó material.dart y rompería TODO import (23 archivos).
          # Migrar a material_ui es tarea propia cuando se actualice el SDK.
          flutter-version: 3.47.5

      - name: pub get
        run: flutter pub get

      - name: flutter analyze (0 issues)
        run: flutter analyze

      - name: flutter test (unit + widget)
        run: flutter test
